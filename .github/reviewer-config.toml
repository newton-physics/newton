approval_policy = "never"
web_search = "disabled"

[features]
multi_agent = false
shell_snapshot = false
apps = false

[shell_environment_policy]
inherit = "none"

[shell_environment_policy.set]
PATH = "/usr/local/bin:/usr/bin:/bin"

[permissions.review.filesystem]
":root" = "deny"
":minimal" = "read"
"/proc" = "deny"
"/sys" = "deny"
# The sandbox re-executes Codex, which the action installs here.
"/opt/hostedtoolcache/node" = "read"

[permissions.review.filesystem.":workspace_roots"]
"." = "read"

[permissions.review.network]
enabled = false
