name: Sync Upstream

# Keeps this fork's `main` current with newton-physics/newton so it never
# drifts far behind. Weekly (and on demand) it merges upstream/main into main:
#   - clean merge      -> pushed straight to main
#   - conflicts        -> an LLM resolves them (full base/ours/theirs context);
#                         the resolved merge is opened as a PR for review + CI
#   - LLM cannot solve -> merge aborted, a tracking issue is opened
# Guarded to run only on the fork, never if this workflow lands upstream.
#
# LLM provider is selectable via repo variable AI_RESOLVE_PROVIDER:
#   anthropic      -> requires secret ANTHROPIC_API_KEY
#   github-models  -> uses the built-in GITHUB_TOKEN (no extra key/billing)
#   openai         -> requires secret OPENAI_API_KEY
# Optional repo variable AI_RESOLVE_MODEL overrides the default model.

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read  # for the github-models LLM provider

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into main
    if: github.repository == 'jkuzmeski/newton'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/newton-physics/newton.git
          git fetch upstream --tags --prune

      - name: Check how far behind upstream
        id: behind
        run: |
          behind=$(git rev-list --count main..upstream/main)
          echo "count=$behind" >> "$GITHUB_OUTPUT"
          echo "main is $behind commit(s) behind upstream/main"

      - name: Attempt merge
        if: steps.behind.outputs.count != '0'
        id: merge
        run: |
          set +e
          git merge --no-edit upstream/main
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Push clean merge to main
        if: steps.behind.outputs.count != '0' && steps.merge.outputs.code == '0'
        run: |
          git push origin main
          echo "Clean merge pushed to main."

      - name: Resolve conflicts with an LLM
        if: steps.behind.outputs.count != '0' && steps.merge.outputs.code != '0'
        id: airesolve
        env:
          AI_RESOLVE_PROVIDER: ${{ vars.AI_RESOLVE_PROVIDER }}
          AI_RESOLVE_MODEL: ${{ vars.AI_RESOLVE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/ai_resolve_conflicts.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open PR with LLM-resolved merge
        if: steps.behind.outputs.count != '0' && steps.merge.outputs.code != '0' && steps.airesolve.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # sanity: no conflict markers must remain anywhere in the tree
          if git grep -lE '^(<<<<<<<|>>>>>>>)' -- . >/dev/null 2>&1; then
            echo "Conflict markers still present after LLM pass; not opening PR."
            exit 1
          fi
          git add -A
          git commit --no-edit
          branch="sync/upstream-$(date +%Y%m%d-%H%M)"
          git push origin "HEAD:refs/heads/${branch}"
          body=$'This upstream sync had merge conflicts that were resolved automatically by an LLM (`scripts/ai_resolve_conflicts.py`) using full base/ours/theirs context.\n\n**Review the diff carefully and let CI run before merging** — the resolution is a best effort, not a guarantee.\n\nConflicted files were resolved to keep the Digital Instron fork working while adopting upstream changes.'
          gh pr create --base main --head "${branch}" \
            --title "Upstream sync (LLM-resolved) $(date +%Y-%m-%d)" \
            --body "$body"

      - name: Open issue when LLM cannot resolve
        if: steps.behind.outputs.count != '0' && steps.merge.outputs.code != '0' && steps.airesolve.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort || true
          body=$'The scheduled upstream sync hit merge conflicts and the LLM resolver could not fully resolve them (or `ANTHROPIC_API_KEY` is not configured).\n\nResolve locally:\n\n```bash\ngit fetch upstream\ngit checkout main\ngit merge upstream/main\n# resolve conflicts, then:\ngit commit\ngit push origin main\n```\n\nTriggered by the `Sync Upstream` workflow.'
          existing=$(gh issue list --state open --search "Upstream sync needs manual merge in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Upstream sync needs manual merge ($(date +%F))" --body "$body"
          fi
