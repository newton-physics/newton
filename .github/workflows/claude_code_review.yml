name: Claude Auto Review

# Review-only automation. Runs solely on the pull request events below; no
# comment, mention, or manual triggers are defined, so @claude mentions do not
# start a session.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Repository secrets are unavailable to pull requests from forks, so only
    # review non-draft, human-authored pull requests opened from branches of
    # this repository.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Load the review policy from the base revision so a pull request cannot
      # change the rules it is reviewed against.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-policy
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            REVIEW_GUIDELINES.rst
            CODING_GUIDELINES.rst
            .agents/skills/code-review-newton/SKILL.md

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc  # v1.0.248
        env:
          # Route inference through the NVIDIA gateway, which serves the
          # Anthropic Messages API and authenticates with a bearer token.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "Authorization: Bearer ${{ secrets.ANTHROPIC_API_KEY }}"
          # Strip secrets from the environment of commands the reviewer runs.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the job token, which is limited to the permissions above and
          # expires with the job, instead of the broader GitHub App token.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated gatekeeper review for Newton pull requests.
            The PR branch is already checked out in the current working directory.

            ## Guidelines

            Read these files in full before reviewing. They are copies from the
            base branch and are authoritative. Use them, not the versions in the
            PR checkout; if the PR changes a policy file, review that change
            against these copies.
            - `.review-policy/REVIEW_GUIDELINES.rst`: the Fit, Requirements, and Standards axes
              and the P0/P1/P2 priorities.
            - `.review-policy/CODING_GUIDELINES.rst`: source code, public API, and test
              conventions, including the public API review checklist and, when
              present, the test organization and runtime section.
            - `.review-policy/.agents/skills/code-review-newton/SKILL.md`: the review procedure.
              Adapt it to this environment: use `gh pr view ${{ github.event.pull_request.number }}` and
              `gh pr diff ${{ github.event.pull_request.number }}` instead of local git history, which is a
              shallow checkout of a detached merge commit. Always pass the PR
              number to `gh pr` commands; there is no current PR branch.

            ## Scope

            Act as a gatekeeper, not a line-by-line critic. Focus on:

            1. **Public API consistency.** For any new or changed public symbol,
               check it against the public API review checklist and the existing
               Newton API families: canonical export and `__all__`, shallow
               namespaces, naming that clusters with related concepts,
               consistent parameter vocabulary and defaults, keyword-only
               optional arguments, enums for closed categories, no unnecessary
               new public nouns, and the deprecation policy for incompatible
               changes. Compare with the neighbouring Newton APIs the change
               resembles and cite them.
            2. **Test and benchmark overhead.** Treat CI runtime as a cost of the
               change. Check whether new tests duplicate existing coverage or
               could extend an existing test, class, or module; whether
               solver-specific tests live under `newton/tests/<solver>/`;
               whether expensive setup is shared where safe; and whether models,
               step counts, and parameter combinations are as small as reliable
               verification allows. Apply the same scrutiny to new ASV
               benchmarks under `asv/benchmarks/` and changes to
               `asv/pr_benchmarks.txt`, which selects benchmarks for every PR.
               Substantial added runtime needs measurements and justification in
               the PR description. Ground each concern in the specific duplicated
               coverage, avoidable setup, or misplaced test.
            3. **Material correctness defects.** Report bugs you can support with
               a concrete triggering input or condition, mechanism, and impact.
            4. **Fit.** Give an explicit Fit verdict only for changes that add or
               change public API or are large and cross-cutting.

            ## Restraint

            - Report only P0 and P1 concerns. Omit P2 observations entirely.
            - Do not comment on formatting, lint, typos, import order, docstring
              wording, or anything pre-commit already enforces.
            - Do not request extra tests, documentation, or refactors unless
              their absence is itself a P1 concern under the guidelines.
            - Post at most 5 inline comments; prioritize the most important.
            - Distinguish demonstrated defects from questions and evidence
              requests. Do not prescribe a specific fix unless it is obvious.
            - Before posting, read the existing PR conversation and review
              comments with `gh pr view ${{ github.event.pull_request.number }} --comments` and
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
              Do not repeat a concern that has already been raised, including by
              an earlier run of this review. On a new push, only comment on
              concerns introduced or left unresolved by the new commits.

            ## Output

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for each concern tied to specific lines. Then post
            exactly one short top-level comment with `gh pr comment ${{ github.event.pull_request.number }} --body "..."` containing
            the Fit verdict when applicable and a brief list of the concerns by
            priority. If there are no P0 or P1 concerns, say so in one or two
            sentences. Only post GitHub comments - don't submit review text as
            messages.

          claude_args: |
            --model azure/anthropic/claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }} --body:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
