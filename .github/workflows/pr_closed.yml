name: Cancel workflows on PR close

on:
  pull_request_target:
    types: [closed]

jobs:
  cancel-pr-workflows:
    name: Cancel in-progress PR workflows
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 3
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: audit

      - name: Cancel in-progress runs for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          echo "PR #$PR_NUMBER closed, cancelling its queued and in-progress workflows"

          # The runs API leaves pull_requests empty here, so bind candidates to the
          # closed PR's complete head identity and the workflows that run PR code.
          for status in in_progress queued; do
            gh api --paginate "/repos/$GH_REPO/actions/runs?status=$status&per_page=100" \
              | jq --raw-output \
                  --argjson head_repo_id "$HEAD_REPO_ID" \
                  --arg head_repo "$HEAD_REPO" \
                  --arg head_branch "$HEAD_BRANCH" \
                  --arg head_sha "$HEAD_SHA" \
                  '
                    .workflow_runs[]
                    | select(.head_repository.id == $head_repo_id)
                    | select(.head_repository.full_name == $head_repo)
                    | select(.head_branch == $head_branch)
                    | select(.head_sha == $head_sha)
                    | select(
                        (
                          .event == "pull_request"
                          and .path == ".github/workflows/pr.yml"
                        )
                        or
                        (
                          .event == "pull_request_target"
                          and (
                            .path == ".github/workflows/pr_target_aws_gpu_tests.yml"
                            or .path == ".github/workflows/pr_target_aws_gpu_benchmarks.yml"
                          )
                        )
                      )
                    | .id
                  ' \
              | while IFS= read -r run_id; do
                  run_id=${run_id%$'\r'}
                  if [ "$run_id" != "$CURRENT_RUN" ]; then
                    echo "Cancelling run $run_id"
                    if ! gh run cancel "$run_id"; then
                      echo "Warning: failed to cancel run $run_id" >&2
                    fi
                  fi
                done
          done
