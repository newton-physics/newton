name: Changelog
permissions:
  contents: read

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches:
      - main
      - "release-*"
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594  # v2.16.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.11.26"
      - name: Validate pull request changelog policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >
          uv run --no-project python scripts/changelog_policy.py check-pr
          --base-ref "$BASE_SHA"
          --target-branch "$TARGET_BRANCH"
          --labels "$PR_LABELS"
      - name: Validate merge group changelog policy
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          TARGET_BRANCH: ${{ github.event.merge_group.base_ref }}
        run: >
          uv run --no-project python scripts/changelog_policy.py check-merge-group
          --base-ref "$BASE_SHA"
          --target-branch "$TARGET_BRANCH"
      - name: Preview Towncrier rendering
        run: >
          uvx --from towncrier==25.8.0 towncrier build --draft
          --version 0.0.0 --date 1970-01-01
