# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: true
  tools:
    github-checks:
      timeout_ms: 900000
  path_instructions:
    - path: "**"
      instructions: |
        Follow changelog.d/README.md. Check that a normal pull request adds one
        logical Towncrier fragment set, or one .skip fragment for a change with
        no user-facing impact, and does not edit CHANGELOG.md directly. A
        numeric fragment identifier must refer to a GitHub issue, not the pull
        request; an orphan identifier must start with +. Entries use imperative
        present tense ("Add X", not "Added X"), end with a period, and use the
        correct category (added, changed, deprecated, removed, or fixed).
        Changed, deprecated, and removed entries must include migration
        guidance.
    - path: "**/*.py"
      instructions: |
        Flag inline code comments (not docstrings) that are verbose or
        redundant: comments that restate what the code already shows, repeat
        the same point in multiple places, or narrate obvious steps. Comments
        should be brief and reserved for non-obvious code, explaining why
        rather than what.
chat:
  auto_reply: true
issue_enrichment:
  auto_enrich:
    enabled: false
