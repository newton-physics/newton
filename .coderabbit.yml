# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CODING_GUIDELINES.rst"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: true
  tools:
    github-checks:
      timeout_ms: 900000
  path_instructions:
    - path: "**"
      instructions: |
        Follow changelog/README.md. For user-facing changes, suggest a
        Towncrier fragment instead of a direct CHANGELOG.md edit. Do not require
        a .skip fragment for changes without user-facing impact. When a fragment
        is present, check that numeric identifiers refer to GitHub issues and
        orphan identifiers start with +. Entries use imperative present tense
        ("Add X", not "Added X"), end with a period, and use the correct
        category (added, changed, deprecated, removed, or fixed). Changed,
        deprecated, and removed entries include migration guidance. Release
        cleanup may edit CHANGELOG.md and delete consumed fragments directly.
    - path: "**/*.py"
      instructions: |
        Flag inline code comments (not docstrings) that are verbose or
        redundant: comments that restate what the code already shows, repeat
        the same point in multiple places, or narrate obvious steps. Comments
        should be brief and reserved for non-obvious code, explaining why
        rather than what.
chat:
  auto_reply: true
issue_enrichment:
  auto_enrich:
    enabled: false
