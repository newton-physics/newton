<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">
  <rect x="0" y="0" width="1100" height="540" fill="#ffffff"/>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6ca3"/>
    </marker>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3471e"/>
    </marker>
  </defs>

  <!-- ===== Left panel: self-contact ===== -->
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#222">Self-contact (vertex-triangle or edge-edge)</text>

  <!-- other triangle, edge-on -->
  <line x1="60" y1="410" x2="470" y2="410" stroke="#8c6d31" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="436" fill="#8c6d31">other triangle, edge-on</text>

  <!-- query radius (dashed) and interaction distance (solid) -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="250" cy="250" r="95" fill="#dbe9f6" fill-opacity="0.55" stroke="#2b6ca3" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="6" fill="#222"/>
  <text x="262" y="246" fill="#222">vertex</text>

  <!-- arrow A: margin, from the vertex to the solid circle -->
  <line x1="250" y1="250" x2="250" y2="157" stroke="#2b6ca3" stroke-width="2.2" marker-end="url(#blue)"/>
  <text x="260" y="196" fill="#2b6ca3">margin</text>
  <text x="260" y="214" fill="#2b6ca3" font-size="13">particle_self_contact_margin</text>

  <!-- arrow B: gap, stacked on top of the margin, up to the dashed circle -->
  <line x1="250" y1="155" x2="250" y2="112" stroke="#777" stroke-width="2.2" marker-end="url(#grey)"/>
  <text x="260" y="128" fill="#555">+ gap</text>
  <text x="260" y="146" fill="#555" font-size="13">particle_self_contact_gap</text>

  <!-- arrow C: query radius, from the vertex to the dashed circle -->
  <line x1="250" y1="250" x2="112" y2="250" stroke="#777" stroke-width="2.2" marker-end="url(#grey)"/>
  <text x="114" y="270" fill="#555" font-size="13">query radius = margin + gap</text>

  <!-- motion budget (radius truncation) -->
  <line x1="412" y1="300" x2="472" y2="300" stroke="#b3471e" stroke-width="3" marker-end="url(#red)"/>
  <text x="404" y="326" fill="#b3471e" font-size="13">motion budget</text>
  <text x="404" y="342" fill="#b3471e" font-size="13">per side between</text>
  <text x="404" y="358" fill="#b3471e" font-size="13">two detections:</text>
  <text x="404" y="374" fill="#b3471e" font-size="13">0.5 x relaxation</text>
  <text x="404" y="390" fill="#b3471e" font-size="13">x query radius</text>

  <!-- footer -->
  <text x="30" y="478" fill="#222" font-size="14">Force acts when the pair distance is below the margin.</text>
  <text x="30" y="500" fill="#222" font-size="14">Pairs are found out to margin + gap; the gap is detection slack only.</text>

  <!-- divider -->
  <line x1="550" y1="20" x2="550" y2="520" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== Right panel: rigid-soft contact ===== -->
  <text x="570" y="34" font-size="18" font-weight="bold" fill="#222">Rigid-soft contact (particle against a shape)</text>
  <text x="570" y="62" fill="#777" font-size="13">detected while the particle surface lies inside the gap band</text>

  <!-- shape -->
  <rect x="590" y="360" width="470" height="80" fill="#c9c9c9" stroke="#666" stroke-width="2"/>
  <text x="602" y="405" fill="#444">shape (rigid or static)</text>

  <!-- shape margin band -->
  <rect x="590" y="330" width="470" height="30" fill="#f1e3c8" fill-opacity="0.9"/>
  <line x1="590" y1="330" x2="1060" y2="330" stroke="#b08a3e" stroke-width="2"/>
  <text x="760" y="352" fill="#8c6d31" font-size="13">shape margin (ShapeConfig.margin)</text>

  <!-- gap band (detection only) -->
  <rect x="590" y="290" width="470" height="40" fill="#f3f3f3" fill-opacity="0.9"/>
  <line x1="590" y1="290" x2="1060" y2="290" stroke="#999" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="760" y="312" fill="#666" font-size="13">+ soft_contact_gap (detection only)</text>

  <!-- particle resting exactly at the interaction distance -->
  <circle cx="700" cy="278" r="52" fill="#dbe9f6" fill-opacity="0.55" stroke="#2b6ca3" stroke-width="2.5"/>
  <circle cx="700" cy="278" r="6" fill="#222"/>
  <line x1="700" y1="278" x2="700" y2="328" stroke="#2b6ca3" stroke-width="2.2" marker-end="url(#blue)"/>
  <text x="690" y="300" fill="#2b6ca3" text-anchor="end">particle radius</text>
  <text x="690" y="318" fill="#2b6ca3" font-size="13" text-anchor="end">particle_radius</text>

  <!-- interaction distance bracket: particle centre to shape surface -->
  <line x1="752" y1="278" x2="1030" y2="278" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1030" y1="278" x2="1030" y2="360" stroke="#222" stroke-width="1.5"/>
  <line x1="1024" y1="278" x2="1036" y2="278" stroke="#222" stroke-width="1.5"/>
  <line x1="1024" y1="360" x2="1036" y2="360" stroke="#222" stroke-width="1.5"/>
  <text x="1036" y="250" fill="#222" text-anchor="end">interaction distance</text>
  <text x="1036" y="268" fill="#222" font-size="13" text-anchor="end">= particle radius + shape margin</text>

  <!-- footer -->
  <text x="570" y="478" fill="#222" font-size="14">Force acts when the distance is below particle radius + shape margin.</text>
  <text x="570" y="500" fill="#222" font-size="14">rigid_soft_enable_dat adds the same motion budget to both sides.</text>
</svg>
