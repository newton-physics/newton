  <text x="40" y="40" class="eyebrow teal">ONE PR · FOUR CONNECTED CHANGES</text>
  <text x="40" y="85" class="title">Remove intermediates. Preserve the coupled solve.</text>
  <text x="40" y="116" class="body muted">Both paths use matrix-free PGS. This is not a switch from a dense contact matrix.</text>
  <rect x="40" y="140" width="1120" height="40" rx="10" fill="#eef2f6"/>
  <text x="600" y="166" class="body center">Inputs: model topology, current state, forces, contacts and joint limits</text>

