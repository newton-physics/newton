<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Sparse FPGS: remove intermediates, preserve the coupled solve</title>
  <desc id="desc">Four changes in one PR: fuse sparse mass assembly and factorization using a leaf-first topology plan; directly construct compact contact and joint-limit responses; solve serial PGS in mixed articulated factor and free-body physical coordinates; decode articulated changes once before existing integration. Contact normal and tangent directions share geometry and factor loads in an eight-lane group. Shared-root coupling, free-body mass response, friction law and numerical budgets remain. The baseline already uses matrix-free PGS. The factor illustration is a toy seven-DOF pattern, not a benchmark.</desc>
