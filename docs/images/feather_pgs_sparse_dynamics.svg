      .muted { fill: #526579; }
      .center { text-anchor: middle; }
      .arrow { fill: none; stroke: #8a9bad; stroke-width: 2; marker-end: url(#arrow); }
      .panel { fill: #fff; stroke: #d5dee7; stroke-width: 1.5; }
      .new { fill: #f5fbfa; stroke: #a8cfcc; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
