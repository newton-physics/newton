  <path d="M944 590 H958" class="arrow"/>
  <rect x="967" y="570" width="167" height="40" rx="8" fill="#dff0ed"/>
  <text x="1050" y="596" class="small center" style="fill:#176565">Share factor loads</text>
  <rect x="652" y="630" width="228" height="42" rx="8" fill="#dff0ed"/>
  <text x="766" y="657" class="body center" style="fill:#176565">Robot: factor row Z</text>
  <rect x="894" y="630" width="240" height="42" rx="8" fill="#fcf0e6"/>
  <text x="1014" y="657" class="body center" style="fill:#8c4c23">Free body: J + response</text>
  <text x="652" y="705" class="body">Write compact rows; no dense J/Y staging.</text>
  <text x="652" y="738" class="small">Z = JPᵀL⁻ᵀ; P reorders the robot's coordinates.</text>

  <path d="M306 761 V780 M894 761 V780" class="arrow"/>
  <rect x="40" y="790" width="532" height="176" rx="14" class="panel"/>
  <rect x="628" y="790" width="532" height="176" rx="14" class="new"/>
  <text x="64" y="829" class="head">PGS with full-width responses</text>
  <text x="64" y="867" class="body">Read J for the residual.</text>
  <text x="64" y="898" class="body">Apply Y for the velocity change.</text>
  <text x="64" y="942" class="small">Illustrative route; main also has specialized paths.</text>
  <text x="652" y="829" class="head">3  PGS with mixed response blocks</text>
  <text x="652" y="867" class="body">Articulations: reuse Z for both operations.</text>
  <text x="652" y="898" class="body">Free bodies: retain physical J and M⁻¹Jᵀ.</text>
  <text x="652" y="942" class="small">One warp / world · serial rows · same paired friction</text>

  <path d="M306 967 V985 M894 967 V985" class="arrow"/>
  <rect x="40" y="998" width="1120" height="116" rx="14" fill="#edf4fa" stroke="#c7d9e9"/>
  <text x="64" y="1034" class="head">4  Return to physical velocity, then use existing integration</text>
  <text x="64" y="1067" class="body">PR: decode articulated changes once after the sweeps. Free-body changes are already physical.</text>
  <text x="64" y="1095" class="small">Shared-root coupling still transmits motion across limbs. Compact rows do not make limbs independent.</text>

  <text x="40" y="1148" class="body teal">Unchanged: collision · timestep / substeps · iteration budgets · friction law · public state interface</text>
  <text x="40" y="1173" class="small">Safety: use the allocated normal/tangent row extent; preserve each row's anchor and free-body mass metric.</text>
</svg>
