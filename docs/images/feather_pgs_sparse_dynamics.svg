  <text x="234" y="305" class="body">Dense n × n factor layout.</text>
  <text x="234" y="338" class="body">Root-first elimination</text>
  <text x="234" y="364" class="body">can fill between branches.</text>
  <text x="817" y="305" class="body">Leaf-first CRBA → L, L⁻¹.</text>
  <text x="817" y="338" class="body">Build directly into packed arrays.</text>
  <text x="817" y="364" class="body">Keep the shared root.</text>
  <text x="64" y="430" class="small">Toy 7-DOF lower factor, root-first ordering.</text>
  <text x="652" y="430" class="small">Same toy, leaf-first. Dark blue = shared root.</text>

