  <text x="64" y="715" class="small">Y = M⁻¹Jᵀ. Pale cells = stored zeros in this row.</text>
  <text x="64" y="740" class="small">Robot B is independent in this illustrative contact.</text>

  <text x="652" y="517" class="head">2  Build compact responses directly</text>
  <text x="652" y="549" class="body muted">Contact N / T₁ / T₂ + joint-limit rows</text>
  <rect x="652" y="570" width="135" height="40" rx="8" fill="#dff0ed"/>
